<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>結印物語</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0f1f">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 佈局：全螢幕 3D 屋頂夜景為底，上方 HUD、下方五鍵導覽，功能以底部抽屜與全螢幕覆蓋層呈現 */
  --ink:#0c0f1f; --panel:#161a31; --panel2:#1f2444; --line:#313865;
  --paper:#f4eddc; --muted:#9ea4c8;
  --seal:#e5412f; --gold:#ecbc52; --jade:#45d3a8;
  --up:#ff5a4d; --down:#3ecf8e;
  --display:"Noto Serif TC","Songti TC",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);overflow:hidden;font-size:15px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.bub{position:absolute;transform:translate(-50%,-100%);background:var(--paper);color:#1b1730;padding:6px 10px;border-radius:12px 12px 12px 2px;font-size:13px;font-weight:500;max-width:170px;box-shadow:0 4px 14px #0008;opacity:0;transition:opacity .25s}
.bub.on{opacity:1}
.tag{position:absolute;transform:translate(-50%,0);font-size:11px;color:var(--paper);background:#0c0f1fb0;padding:1px 7px;border-radius:9px;white-space:nowrap;border:1px solid #fff2}
.tag b{color:var(--gold);font-weight:700;margin-left:4px}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;background:linear-gradient(#0c0f1fd0,#0c0f1f00)}
#hud>*{pointer-events:auto}
.logo{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.12em;line-height:1}
.logo i{display:inline-grid;place-items:center;width:28px;height:28px;margin-right:6px;background:var(--seal);color:#fff;border-radius:5px;font-style:normal;font-size:17px;letter-spacing:0;transform:rotate(-4deg)}
.logo small{display:block;font-family:var(--body);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.05em;margin-top:6px}
#coin{display:flex;align-items:center;gap:8px;background:#161a31e0;border:1px solid var(--line);border-radius:22px;padding:5px 12px 5px 5px;font-variant-numeric:tabular-nums;font-weight:700}
#coin .c{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,var(--gold) 55%,#a87618);display:grid;place-items:center;color:#5d3c00;font-family:var(--display);font-size:15px;box-shadow:0 0 0 2px #0004 inset}
#coin small{display:block;font-weight:400;font-size:10px;color:var(--muted);line-height:1}
#hint{position:fixed;left:0;right:0;bottom:104px;text-align:center;font-size:12px;color:var(--muted);pointer-events:none}

/* 導覽 */
#nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr 1.3fr 1fr 1fr;align-items:end;padding:8px 10px 12px;background:linear-gradient(#0c0f1f00,#0c0f1ff0 45%)}
#nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);padding:6px 0}
#nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#nav .big{color:#fff}
#nav .big span{width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#ff8a6b,var(--seal) 60%,#8f1c10);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:26px;box-shadow:0 0 0 3px var(--ink),0 0 0 5px var(--gold),0 8px 22px #e5412f70}

/* 抽屜 */
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:86%;background:var(--panel);border-radius:20px 20px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 -12px 40px #000a}
#sheet.on{transform:none}
#sheet header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
#sheet h2{margin:0;font-family:var(--display);font-size:19px;letter-spacing:.08em}
.x{width:34px;height:34px;border-radius:50%;background:var(--panel2);font-size:18px;line-height:1}
#sbody{overflow-y:auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.row .g{flex:1;min-width:0}
.row .g b{display:block;font-weight:700}
.row .g small{color:var(--muted);font-size:12px;display:block}
.btn{background:var(--seal);color:#fff;font-weight:700;border-radius:10px;padding:8px 14px;white-space:nowrap}
.btn.g2{background:var(--panel);border:1px solid var(--line);color:var(--paper)}
.btn.gd{background:var(--gold);color:#3b2600}
.btn:disabled{opacity:.4}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;padding:8px 0;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-weight:500}
.tabs button.on{background:var(--paper);color:#1b1730;border-color:var(--paper);font-weight:700}
.ico{position:relative;flex:none;display:block;background:url(art/species.webp) 0 0/500% 300% no-repeat}
.ico svg{width:100%;height:100%;display:block}
.ico img{position:absolute;border-radius:50%;object-fit:cover}
.tier{display:inline-block;font-size:11px;padding:1px 7px;border-radius:8px;border:1px solid;margin-left:6px;vertical-align:middle}
.t1{color:var(--jade)}.t2{color:#7fb2ff}.t3{color:var(--gold)}
.hero{display:flex;gap:14px;align-items:center}
.hero input{background:none;border:0;border-bottom:1px dashed var(--line);color:var(--paper);font:700 20px var(--display);width:100%;padding:2px 0}
.bar{height:8px;border-radius:5px;background:#0c0f1f;overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:5px;background:var(--jade)}
.stat{display:grid;grid-template-columns:38px 1fr 62px;align-items:center;gap:8px;font-size:13px}
.stat span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.stat em{color:var(--gold);font-style:normal;font-size:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{background:var(--panel2);border:1px dashed var(--line);border-radius:12px;padding:8px;text-align:center;font-size:12px;min-height:58px}
.slot small{display:block;color:var(--muted);font-size:11px}
.slot b{display:block;color:var(--gold);font-weight:500}
h3{margin:0;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.1em}
.sec{display:flex;flex-direction:column;gap:8px}
.note{font-size:12px;color:var(--muted);line-height:1.6}
.rank{display:grid;grid-template-columns:34px 40px 1fr auto;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px solid #313865a0}
.rank .n{font-family:var(--display);font-weight:900;text-align:center;color:var(--muted)}
.rank.me{background:#ecbc5218;border-radius:10px}
.rank:nth-child(-n+3) .n{color:var(--gold);font-size:18px}
.rank .lv{font-variant-numeric:tabular-nums;font-weight:700}
.log{background:#0c0f1f;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.8;min-height:150px}
.log .w{color:var(--gold);font-weight:700}

/* 收服 */
#cap{position:fixed;inset:0;background:#000;display:none;overflow:hidden}
#cap.on{display:block}
#cap video,#cap>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#capTop{position:absolute;left:0;right:0;top:0;padding:12px 16px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(#000c,#0000)}
#capTop .l1{display:flex;justify-content:space-between;align-items:center}
#seals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#seals button{background:#161a31c8;border:1px solid var(--line);border-radius:12px;padding:7px 4px;font-size:11px;color:var(--muted);line-height:1.35}
#seals button b{display:block;font:900 17px var(--display);color:var(--paper)}
#seals button.on{border-color:var(--gold);background:#3a2c10d8;color:var(--gold)}
#ret{position:absolute;left:50%;top:40%;width:26px;height:26px;margin:-13px;border-radius:50%;border:2px solid #fff9;box-shadow:0 0 0 1px #0006}
#ret::after{content:"";position:absolute;inset:9px;border-radius:50%;background:#fff}
#frame{position:absolute;left:50%;top:40%;border:3px solid var(--gold);border-radius:50% 50% 46% 46%/42% 42% 58% 58%;box-shadow:0 0 0 2000px #0006,0 0 22px var(--gold) inset;will-change:transform}
#frame.hit{border-color:var(--jade);box-shadow:0 0 0 2000px #0006,0 0 30px var(--jade) inset}
#capMsg{position:absolute;left:16px;right:16px;top:64%;text-align:center;font:900 22px var(--display);text-shadow:0 2px 10px #000;letter-spacing:.1em;pointer-events:none}
#capBot{position:absolute;left:0;right:0;bottom:0;height:34%;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(#0000,#000b)}
#hands{position:absolute;bottom:-6px;left:50%;width:min(92%,380px);transform:translateX(-50%);transition:transform .15s}
#hands.cast{transform:translateX(-50%) translateY(-18px) scale(1.05)}
#capBtn{position:relative;margin-bottom:22px;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#ff8a6b,var(--seal) 60%,#8f1c10);color:#fff;font:900 30px var(--display);box-shadow:0 0 0 4px #000,0 0 0 6px var(--gold),0 0 34px #e5412fb0}
#capBtn small{display:block;font:500 11px var(--body);letter-spacing:.1em}
#capBtn:active{transform:scale(.94)}
#src{position:absolute;inset:0;background:#0c0f1fee;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#src.on{display:flex}
#src p{margin:0;color:var(--muted);max-width:300px;line-height:1.7;font-size:13px}
#src .btn{min-width:210px;padding:12px 16px;display:inline-block}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}

/* 手機：台股 */
#phone{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px}
#phone.on{display:flex}
.ph{width:min(100%,390px);height:min(100%,740px);background:#05070f;border:3px solid #3a4069;border-radius:34px;padding:12px;display:flex;flex-direction:column;box-shadow:0 20px 60px #000}
.ph .scr{flex:1;background:var(--ink);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.ph .top{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ph .top .l1{display:flex;justify-content:space-between;align-items:center}
.ph h2{margin:0;font:900 17px var(--display);letter-spacing:.06em}
.pill{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
.pill.open{color:var(--up);border-color:var(--up)}
.sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:11px;color:var(--muted)}
.sum b{display:block;font-size:14px;color:var(--paper);font-variant-numeric:tabular-nums}
#pbody{flex:1;overflow-y:auto;padding:8px 12px 16px}
.q{display:grid;grid-template-columns:1fr 70px 78px;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid #31386580;width:100%;text-align:left}
.q b{display:block}.q small{color:var(--muted);font-size:11px}
.q .p{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.q .ch{text-align:center;border-radius:6px;padding:4px 0;font-size:12px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--down)}
.ch.up{background:var(--up);color:#fff}.ch.dn{background:var(--down);color:#062}
.pxb{font:900 34px var(--display);font-variant-numeric:tabular-nums}
#qty{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--paper);font:700 18px var(--body);padding:8px 10px;text-align:right}
.sw{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.sw input{width:18px;height:18px;accent-color:var(--gold)}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%) translateY(-20px);background:var(--paper);color:#1b1730;font-weight:700;padding:9px 16px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;max-width:86%;text-align:center;box-shadow:0 6px 20px #0009}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="bubbles"></div>

<div id="hud">
  <div class="logo"><i>印</i>結印物語<small id="cnt"></small></div>
  <button id="coin" data-a="phone" aria-label="開啟手機台股"><span class="c">Z</span><span><span id="zeny">0</span><small>點我看盤</small></span></button>
</div>
<div id="hint">拖曳旋轉場景 · 點夥伴互動</div>

<nav id="nav">
  <button data-a="list"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4"/><path d="M4 21c1-5 15-5 16 0"/></svg>夥伴</button>
  <button data-a="shop"><svg viewBox="0 0 24 24"><path d="M4 9h16l-1 11H5z"/><path d="M8 9a4 4 0 0 1 8 0"/></svg>商店</button>
  <button class="big" data-a="cap"><span>印</span>結印收服</button>
  <button data-a="arena"><svg viewBox="0 0 24 24"><path d="M5 4l14 14M19 4L5 18M4 15l5 5M20 15l-5 5"/></svg>競技</button>
  <button data-a="rank"><svg viewBox="0 0 24 24"><path d="M4 20V11h5v9M9.5 20V5h5v15M15 20v-7h5v7"/></svg>排行</button>
</nav>

<section id="sheet" aria-live="polite"><header><h2 id="stitle"></h2><button class="x" data-a="close" aria-label="關閉">×</button></header><div id="sbody"></div></section>

<section id="cap">
  <video id="cv" playsinline muted autoplay></video>
  <img id="ci" alt="" hidden>
  <div id="frame"></div><div id="ret"></div>
  <div id="capMsg"></div>
  <div id="capBot"><div id="hands"></div><button id="capBtn" data-a="cast">印<small>收服</small></button></div>
  <div id="capTop">
    <div class="l1"><b style="font-family:var(--display);letter-spacing:.1em">框框對到準星上的臉，就結印</b><button class="x" data-a="capClose" aria-label="離開收服">×</button></div>
    <div id="seals"></div>
  </div>
  <div id="src">
    <h2 style="font-family:var(--display);margin:0">這裡開不了即時鏡頭</h2>
    <p>在這個預覽環境相機被擋住了。先拍一張照片來收服，或用示範臉試玩。裝成 PWA 後就是即時鏡頭。</p>
    <label class="btn gd" for="file">拍照 / 選照片</label>
    <input id="file" type="file" accept="image/*" capture="environment" hidden>
    <button class="btn g2" data-a="demo">用示範臉試玩</button>
    <button class="btn g2" data-a="capClose">返回</button>
  </div>
  <div id="flash"></div>
</section>

<section id="phone"><div class="ph"><div class="scr">
  <div class="top">
    <div class="l1"><h2>台股下單</h2><span><span class="pill" id="mkt"></span> <button class="x" data-a="phoneClose" aria-label="關閉手機">×</button></span></div>
    <div class="sum"><span>可用 zeny<b id="pz"></b></span><span>持股市值<b id="pv"></b></span><span>未實現損益<b id="pl"></b></span></div>
    <label class="sw"><input type="checkbox" id="prac">練習盤（休市也能試單，報價為模擬）</label>
  </div>
  <div id="pbody"></div>
</div></div></section>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* ====== 設定：自架後把報價代理網址填這裡（回傳 {"2330":1234.5,...}），留空則用模擬報價 ====== */
const QUOTE_API='';

const $=s=>document.querySelector(s);
const fmt=n=>Math.round(n).toLocaleString('en-US');
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const SN=['力量','智慧','敏捷','體力','幸運'];
const TN=['','可愛系','威猛系','神仙英雄'];
const SEAL=[null,
 {n:'子印',d:'初階 · 可愛動物',cost:0,spd:.5,tol:.3,f:[[0,1,1,0],[0,1,1,0]]},
 {n:'寅印',d:'中階 · 威猛動物',cost:5000,spd:.8,tol:.21,f:[[1,1,1,1],[1,1,1,1]]},
 {n:'辰印',d:'高階 · 神仙英雄',cost:50000,spd:1.15,tol:.14,f:[[1,1,0,1],[1,0,1,1]]}];
// 物種：id,名,階,主色,副色,耳型,初始[力智敏體運],專屬武器,專屬防具
const SP=[
 ['shiba','柴犬',1,'#e3a455','#fff1d6','point',[6,4,7,6,7],'骨頭迴力鏢','唐草領巾'],
 ['cat','橘貓',1,'#f08a3c','#ffe6c9','point',[4,6,8,4,8],'逗貓棒雙節棍','紙箱鎧甲'],
 ['rabbit','白兔',1,'#f1eef5','#ffc9d6','long',[3,6,9,4,8],'胡蘿蔔短劍','棉花披風'],
 ['otter','水獺',1,'#8a6248','#e8d3bd','round',[5,7,6,6,6],'蛤蜊飛石','防水毛皮'],
 ['penguin','企鵝',1,'#2c3350','#ffffff','none',[5,5,4,9,7],'冰棒長槍','燕尾禮服'],
 ['bear','台灣黑熊',2,'#23232b','#f3e3b0','round',[14,7,6,14,9],'V字熊掌拳套','山林重甲'],
 ['leopard','雲豹',2,'#b99a6a','#4a3a2a','round',[11,8,15,8,8],'雲紋利爪','霧影皮甲'],
 ['eagle','大冠鷲',2,'#5b4636','#f2e9d8','wing',[10,10,14,7,9],'風切羽刃','翼骨輕鎧'],
 ['wolf','白狼',2,'#dfe6f2','#8fa6c9','point',[12,9,12,9,8],'月牙獠刀','雪原披肩'],
 ['tiger','猛虎',2,'#f0942e','#2a1c12','round',[15,6,10,12,7],'王字大刀','虎紋戰袍'],
 ['nezha','三太子',3,'#e5412f','#ffd76a','crown',[18,13,19,12,13],'火尖槍','混天綾'],
 ['tudi','土地公',3,'#c98a2b','#fff3cf','hat',[10,18,9,16,22],'福德拐杖','員外錦袍'],
 ['yuelao','月老',3,'#c43d6b','#ffe1ea','hat',[9,21,13,11,21],'姻緣紅線','月華長衫'],
 ['guan','武聖',3,'#1f7a4d','#ecbc52','crown',[22,15,12,17,9],'青龍偃月刀','綠袍金甲'],
 ['lion','風獅爺',3,'#8d8f98','#e5412f','mane',[17,11,11,21,15],'鎮風印','花崗石鎧']
].map(a=>({id:a[0],n:a[1],t:a[2],c:a[3],c2:a[4],ear:a[5],b:a[6],w:a[7],a:a[8]}));
const sp=id=>SP.find(s=>s.id===id);
const ITEMS={};
SP.forEach(s=>{const t=s.t,k=t*t,ord=s.b.map((v,i)=>[v,i]).sort((x,y)=>y[0]-x[0]);

 fight(id){const c=S.cr.find(x=>x.id===+id);if(c.sta<20)return toast('體力值不足 20');c.sta-=20;
  const es=pick(SP.filter(s=>s.t<=sp(c.sp).t+1)),e={name:pick(NPCN)+'的'+es.n,sp:es.id,lv:Math.max(0,c.lv+Math.floor(rnd(-2,4)))};
  e.t=es.b.map(v=>v*(1+e.lv*.085)+rnd(0,3));const me={name:c.name,t:total(c),luck:c.mood/100};e.luck=.5;
  [me,e].forEach(u=>{u.hp=u.mx=50+u.t[3]*8});const lines=[];let a=me.t[2]>=e.t[2]?me:e,b=a===me?e:me,n=0;
  while(me.hp>0&&e.hp>0&&n++<40){if(Math.random()<Math.min(.35,Math.max(.03,(b.t[2]-a.t[2])/200+.08)))lines.push(`${esc(b.name)} 閃過了攻擊`);
   else{let d=a.t[0]*2+a.t[1]*.8+rnd(0,8)-b.t[3]*.5;const cr=Math.random()<.05+a.t[4]/400+a.luck*.05;if(cr)d*=1.8;d=Math.max(3,Math.round(d));b.hp-=d;lines.push(`${esc(a.name)} ${cr?'爆擊！':'出招，'}造成 ${d} 傷害（${esc(b.name)} 剩 ${Math.max(0,Math.round(b.hp))}）`)}
   [a,b]=[b,a]}
  const win=me.hp>0&&e.hp<=0||me.hp>e.hp,z=win?2000+c.lv*300:0,x=win?30+c.lv*8:10+c.lv*2;S.zeny+=z;const up=gain(c,x);c.mood=Math.max(0,Math.min(100,c.mood+(win?6:-6)));hud();
  lines.push(`<span class="w">${win?`勝利！獲得 ${fmt(z)} zeny、經驗 +${x}`:`落敗… 經驗 +${x}`}${up?`，升到 Lv ${c.lv}`:''}</span>`);
  sheet('對戰',`<div class="row">${icon(c.sp,faceOf(c),46)}<span class="g"><b>${esc(c.name)}</b><small>Lv ${c.lv}</small></span><b>VS</b><span class="g" style="text-align:right"><b>${esc(e.name)}</b><small>Lv ${e.lv}</small></span>${icon(e.sp,null,46)}</div><div class="log" id="log"></div><div class="grid2"><button class="btn" data-a="fight" data-v="${c.id}">再戰</button><button class="btn g2" data-a="arena">換人</button></div>`);
  let i=0;clearInterval(A.ft);A.ft=setInterval(()=>{const l=$('#log');if(!l||i>=lines.length)return clearInterval(A.ft);l.innerHTML+=lines[i++]+'<br>';$('#sbody').scrollTop=1e5},260)},

 async cap(){A.close();capTier=capTier||1;$('#cap').classList.add('on');$('#capMsg').textContent='';drawSeals();
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});const v=$('#cv');v.hidden=false;$('#ci').hidden=true;v.srcObject=stream;await v.play();capSrc=v;$('#src').classList.remove('on')}

  g.fillStyle='#2f6a5c';g.beginPath();g.ellipse(300,760,210,300,0,0,7);g.fill();const f=new Image();f.onload=()=>{g.save();g.beginPath();g.arc(300,400,120,0,7);g.clip();g.drawImage(f,180,280,240,240);g.restore();setImg(c.toDataURL('image/jpeg',.85))};f.src=defFace()},

  const h=$('#hands');h.classList.add('cast');setTimeout(()=>h.classList.remove('cast'),260);

  const s=pick(SP.filter(x=>x.t===capTier)),c=mk(s.id,acc,face);S.cr.push(c);save();build3D();
  msg(acc>.75?'完美結印！':'收服成功！',900);

let capTier=1,capSrc=null,capRun=false,capX=0,capDir=1,capT=0,stream=null,busy=false;
const frameW=()=>Math.min(innerWidth*.44,200);
function drawSeals(){$('#seals').innerHTML=[1,2,3].map(t=>`<button class="${t===capTier?'on':''}" data-a="seal" data-v="${t}"><b>${SEAL[t].n}</b>${SEAL[t].d}<br>${SEAL[t].cost?fmt(SEAL[t].cost)+' zeny':'免費'}</button>`).join('');
 const f=SEAL[capTier].f,skin='#eac7a4',ln='#8a5a3c';let s='<svg viewBox="0 0 380 190">';
 [0,1].forEach(h=>{const ox=h?196:44,rot=h?-9:9;s+=`<g transform="rotate(${rot} ${ox+70} 190)"><rect x="${ox}" y="96" width="140" height="130" rx="34" fill="${skin}" stroke="${ln}" stroke-width="3"/>`;
  f[h].forEach((u,i)=>{const hh=u?[84,100,96,74][h?3-i:i]:30;s+=`<rect x="${ox+6+i*33}" y="${106-hh}" width="29" height="${hh+20}" rx="14" fill="${skin}" stroke="${ln}" stroke-width="3"/>`});
  s+=`<rect x="${h?ox-22:ox+132}" y="112" width="30" height="74" rx="15" fill="${skin}" stroke="${ln}" stroke-width="3" transform="rotate(${h?-24:24} ${h?ox-7:ox+147} 150)"/></g>`});
 $('#hands').innerHTML=s+`<circle cx="190" cy="70" r="26" fill="none" stroke="${['','#45d3a8','#7fb2ff','#ecbc52'][capTier]}" stroke-width="3" opacity=".9"/><text x="190" y="81" text-anchor="middle" font-size="30" font-weight="900" font-family="serif" fill="#fff">${SEAL[capTier].n[0]}</text></svg>`;
 const fw=frameW(),fr=$('#frame');fr.style.width=fw+'px';fr.style.height=fw*1.28+'px';fr.style.marginLeft=-fw/2+'px';fr.style.marginTop=-fw*.64+'px';}
function capLoop(t){if(!capRun)return;requestAnimationFrame(capLoop);const dt=Math.min(.05,(t-capT)/1000);capT=t;if(busy)return;
 const A0=innerWidth*.33;capX+=capDir*innerWidth*SEAL[capTier].spd*dt;if(capX>A0){capX=A0;capDir=-1}if(capX<-A0){capX=-A0;capDir=1}
 $('#frame').style.transform=`translateX(${capX}px)`;}
function msg(m,ms){const e=$('#capMsg');e.textContent=m;clearTimeout(msg.t);msg.t=setTimeout(()=>e.textContent='',ms)}
function setImg(url){const im=$('#ci');im.onload=()=>{im.hidden=false;$('#cv').hidden=true;capSrc=im;$('#src').classList.remove('on')};im.src=url}

function crop(fw){const W=innerWidth,H=innerHeight,sw=capSrc.videoWidth||capSrc.naturalWidth,sh=capSrc.videoHeight||capSrc.naturalHeight,sc=Math.max(W/sw,H/sh);
 const cx=W/2+capX,cy=H*.4,side=fw*1.05,sx=(cx-side/2-(W-sw*sc)/2)/sc,sy=(cy-side/2-(H-sh*sc)/2)/sc;
 const c=document.createElement('canvas');c.width=c.height=128;try{c.getContext('2d').drawImage(capSrc,sx,sy,side/sc,side/sc,0,0,128,128);return c.toDataURL('image/jpeg',.8)}catch(e){return null}}

 b.innerHTML=`<button class="btn g2" data-a="back" style="margin:6px 0 10px">‹ 返回列表</button>
 <div><b style="font-size:17px">${s[1]}</b> <small style="color:var(--muted)">${stk}</small></div>
 <div class="pxb" id="dp"></div><svg id="sp" viewBox="0 0 300 80" style="width:100%;height:80px;margin:6px 0 10px"></svg>
 <div class="row" style="margin-bottom:10px"><span class="g"><small>持有</small><b>${h?fmt(h.q):0} 股</b></span><span class="g"><small>均價</small><b>${h?(h.cost/h.q).toFixed(2):'—'}</b></span><span class="g"><small>損益</small><b id="dpl">—</b></span></div>
 <label for="qty" class="note">股數</label><input id="qty" type="number" inputmode="numeric" min="1" value="100">
 <div class="grid5" style="grid-template-columns:repeat(4,1fr);margin:8px 0">${[1,10,100,1000].map(n=>`<button class="btn g2" style="padding:7px 0" data-a="q" data-v="${n}">+${n}</button>`).join('')}</div>
 <p class="note" id="est"></p>
 <div class="grid2"><button class="btn" data-a="buy" style="background:var(--up)">買進</button><button class="btn" data-a="sell" style="background:var(--down);color:#063">賣出</button></div>
 <p class="note">手續費 0.1425%，賣出另收證交稅 0.3%。</p>`;
 $('#qty').oninput=est;updDetail()}
function updDetail(){head();const c=chg(stk),p=S.px[stk],d=$('#dp');if(!d)return;d.innerHTML=`<span class="${c>=0?'up':'dn'}">${p.toFixed(2)} <small style="font-size:14px">${c>=0?'▲':'▼'} ${Math.abs(c).toFixed(2)}%</small></span>`;
 const h=HIST[stk].length>1?HIST[stk]:[REF[stk],p],mn=Math.min(...h,REF[stk]),mx=Math.max(...h,REF[stk]),r=mx-mn||1,pt=h.map((v,i)=>`${(i/(h.length-1)*296+2).toFixed(1)},${(74-(v-mn)/r*66).toFixed(1)}`),col=c>=0?'#ff5a4d':'#3ecf8e',ry=74-(REF[stk]-mn)/r*66,l=pt[pt.length-1].split(',');
 $('#sp').innerHTML=`<line x1="0" x2="300" y1="${ry}" y2="${ry}" stroke="#9ea4c8" stroke-dasharray="3 4" stroke-width="1" opacity=".5"/><polygon points="2,80 ${pt.join(' ')} 298,80" fill="${col}" opacity=".14"/><polyline points="${pt.join(' ')}" fill="none" stroke="${col}" stroke-width="2"/><circle cx="${l[0]}" cy="${l[1]}" r="3.5" fill="${col}"/>`;
 const hd=S.port[stk],e=$('#dpl');if(hd){const pl=hd.q*p-hd.cost;e.textContent=(pl>=0?'+':'')+fmt(pl);e.className=pl>=0?'up':'dn'}est()}
function est(){const q=Math.max(0,Math.floor(+$('#qty').value||0)),a=q*S.px[stk],fee=Math.max(1,Math.ceil(a*.001425));$('#est').textContent=`買進約 ${fmt(a+fee)} zeny（含手續費 ${fmt(fee)}）· 賣出約可得 ${fmt(a-fee-Math.ceil(a*.003))}`}
function trade(dir){if(!canTrade())return toast('休市中，勾「練習盤」可試單');const q=Math.floor(+$('#qty').value||0);if(q<1)return toast('請輸入股數');
 const p=S.px[stk],a=q*p,fee=Math.max(1,Math.ceil(a*.001425));let h=S.port[stk];
 if(dir>0){const cost=Math.ceil(a)+fee;if(S.zeny<cost)return toast('zeny 不夠');S.zeny-=cost;h=S.port[stk]=h||{q:0,cost:0};h.q+=q;h.cost+=cost;toast(`買進 ${fmt(q)} 股，花費 ${fmt(cost)}`)}
 else{if(!h||h.q<q)return toast('持股不足');const get=Math.floor(a)-fee-Math.ceil(a*.003),part=h.cost*q/h.q;S.zeny+=get;h.q-=q;h.cost-=part;if(!h.q)delete S.port[stk];toast(`賣出 ${fmt(q)} 股，${get-part>=0?'賺':'賠'} ${fmt(Math.abs(get-part))}`)}
 hud();drawPhone()}
$('#prac').onchange=e=>{S.prac=e.target.checked;save();drawPhone()};

/* ====== 啟動 ====== */
load();STK.forEach(s=>{REF[s[0]]=S.px[s[0]];HIST[s[0]].push(S.px[s[0]])});
hud();
try{init3D()}catch(e){console.error(e)}
if(!R)$('#cnt').textContent=`已收服 ${S.cr.length} 位夥伴`;
if('serviceWorker' in navigator&&/github\.io$|localhost/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{});
setInterval(tick,2000);
setInterval(()=>{S.cr.forEach(c=>{c.sta=Math.min(100,c.sta+1);c.mood=Math.max(0,c.mood-.2)});save()},15000);
</script>
</body>
</html>

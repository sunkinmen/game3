<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>封印物語</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0f1f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="封印物語">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 佈局：全螢幕 3D 屋頂夜景為底，上方 HUD、下方五鍵導覽，功能以底部抽屜與全螢幕覆蓋層呈現 */
  --ink:#0c0f1f; --panel:#161a31; --panel2:#1f2444; --line:#313865;
  --paper:#f4eddc; --muted:#9ea4c8;
  --seal:#e5412f; --gold:#ecbc52; --jade:#45d3a8;
  --up:#ff5a4d; --down:#3ecf8e;
  --display:"Noto Serif TC","Songti TC",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --wood:radial-gradient(circle at 34% 28%,#ffffff22,#0000 46%),url(art/wood.webp) center/104% no-repeat,#5a3a1f;
  --cal:"Ma Shan Zheng","Noto Serif TC",serif;
  color-scheme:dark;
}
.cal{font-family:var(--cal);font-weight:400}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);overflow:hidden;font-size:15px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.bub{position:absolute;transform:translate(-50%,-100%);background:var(--paper);color:#1b1730;padding:6px 10px;border-radius:12px 12px 12px 2px;font-size:13px;font-weight:500;max-width:170px;box-shadow:0 4px 14px #0008;opacity:0;transition:opacity .25s}
.bub.on{opacity:1}
.tag{position:absolute;transform:translate(-50%,0);font-size:11px;color:var(--paper);background:#0c0f1fb0;padding:1px 7px;border-radius:9px;white-space:nowrap;border:1px solid #fff2}
.tag b{color:var(--gold);font-weight:700;margin-left:4px}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;background:linear-gradient(#0c0f1fd0,#0c0f1f00)}
#hud>*{pointer-events:auto}
.logo{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.12em;line-height:1}
.logo i{display:inline-grid;place-items:center;width:28px;height:28px;margin-right:6px;background:var(--wood);color:#f6e7c5;border-radius:5px;font-style:normal;font-family:var(--cal);font-weight:400;font-size:21px;letter-spacing:0;transform:rotate(-4deg);text-shadow:0 1px 0 #2a1608;box-shadow:0 0 0 1px #3b2412}
.logo small{display:block;font-family:var(--body);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.05em;margin-top:6px}
#coin{display:flex;align-items:center;gap:8px;background:#161a31e0;border:1px solid var(--line);border-radius:22px;padding:5px 12px 5px 5px;font-variant-numeric:tabular-nums;font-weight:700}
#coin .c{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,var(--gold) 55%,#a87618);display:grid;place-items:center;color:#5d3c00;font-family:var(--display);font-size:15px;box-shadow:0 0 0 2px #0004 inset}
#coin small{display:block;font-weight:400;font-size:10px;color:var(--muted);line-height:1}
#hint{position:fixed;left:0;right:0;bottom:104px;text-align:center;font-size:12px;color:var(--muted);pointer-events:none}

/* 導覽 */
#nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr 1.3fr 1fr 1fr;align-items:end;padding:8px 10px 12px;background:linear-gradient(#0c0f1f00,#0c0f1ff0 45%)}
#nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);padding:6px 0}
#nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#nav .big{color:#fff}
#nav .big span{width:68px;height:68px;border-radius:50%;background:var(--wood);color:#f6e7c5;display:grid;place-items:center;font-family:var(--cal);font-weight:400;font-size:40px;text-shadow:0 2px 0 #2a1608;box-shadow:0 0 0 3px var(--ink),0 0 0 5px var(--gold),0 8px 22px #000a}

/* 抽屜 */
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:86%;background:var(--panel);border-radius:20px 20px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 -12px 40px #000a}
#sheet.on{transform:none}
#sheet header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
#sheet h2{margin:0;font-family:var(--display);font-size:19px;letter-spacing:.08em}
.x{width:34px;height:34px;border-radius:50%;background:var(--panel2);font-size:18px;line-height:1}
#sbody{overflow-y:auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.row .g{flex:1;min-width:0}
.row .g b{display:block;font-weight:700}
.row .g small{color:var(--muted);font-size:12px;display:block}
.btn{background:var(--seal);color:#fff;font-weight:700;border-radius:10px;padding:8px 14px;white-space:nowrap}
.btn.g2{background:var(--panel);border:1px solid var(--line);color:var(--paper)}
.btn.gd{background:var(--gold);color:#3b2600}
.btn:disabled{opacity:.4}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;padding:8px 0;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-weight:500}
.tabs button.on{background:var(--paper);color:#1b1730;border-color:var(--paper);font-weight:700}
.ico{position:relative;flex:none;display:block;background:url(art/species.webp) 0 0/500% 300% no-repeat}
.ico svg{width:100%;height:100%;display:block}
.ico img{position:absolute;border-radius:50%;object-fit:cover;scale:1.15;-webkit-mask:radial-gradient(closest-side,#000 88%,#0000 100%);mask:radial-gradient(closest-side,#000 88%,#0000 100%);filter:saturate(1.05)}
.ico::after{content:none}
.tier{display:inline-block;font-size:11px;padding:1px 7px;border-radius:8px;border:1px solid;margin-left:6px;vertical-align:middle}
.t1{color:var(--jade)}.t2{color:#7fb2ff}.t3{color:var(--gold)}
.hero{display:flex;gap:14px;align-items:center}
.hero input{background:none;border:0;border-bottom:1px dashed var(--line);color:var(--paper);font:700 20px var(--display);width:100%;padding:2px 0}
.bar{height:8px;border-radius:5px;background:#0c0f1f;overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:5px;background:var(--jade)}
.stat{display:grid;grid-template-columns:38px 1fr 62px;align-items:center;gap:8px;font-size:13px}
.stat span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.stat em{color:var(--gold);font-style:normal;font-size:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{background:var(--panel2);border:1px dashed var(--line);border-radius:12px;padding:8px;text-align:center;font-size:12px;min-height:58px}
.slot small{display:block;color:var(--muted);font-size:11px}
.slot b{display:block;color:var(--gold);font-weight:500}
h3{margin:0;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.1em}
.sec{display:flex;flex-direction:column;gap:8px}
.note{font-size:12px;color:var(--muted);line-height:1.6}
.rank{display:grid;grid-template-columns:34px 40px 1fr auto;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px solid #313865a0}
.rank .n{font-family:var(--display);font-weight:900;text-align:center;color:var(--muted)}
.rank.me{background:#ecbc5218;border-radius:10px}
.rank:nth-child(-n+3) .n{color:var(--gold);font-size:18px}
.rank .lv{font-variant-numeric:tabular-nums;font-weight:700}
.log{background:#0c0f1f;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.8;min-height:150px}
.log .w{color:var(--gold);font-weight:700}

/* 收服 */
#cap{position:fixed;inset:0;background:#000;display:none;overflow:hidden}
#cap.on{display:block}
#cap video,#cap>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#capTop{position:absolute;left:0;right:0;top:0;padding:12px 16px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(#000c,#0000)}
#capTop .l1{display:flex;justify-content:space-between;align-items:center}
#seals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#seals button{background:#161a31c8;border:1px solid var(--line);border-radius:12px;padding:7px 4px;font-size:11px;color:var(--muted);line-height:1.35}
#seals button b{display:block;font:900 17px var(--display);color:var(--paper)}
#seals button.on{border-color:var(--gold);background:#3a2c10d8;color:var(--gold)}
#ret{position:absolute;left:50%;top:40%;width:26px;height:26px;margin:-13px;border-radius:50%;border:2px solid #fff9;box-shadow:0 0 0 1px #0006}
#ret::after{content:"";position:absolute;inset:9px;border-radius:50%;background:#fff}
#frame{position:absolute;left:50%;top:40%;border:3px solid var(--gold);border-radius:50% 50% 46% 46%/42% 42% 58% 58%;box-shadow:0 0 0 2000px #0006,0 0 22px var(--gold) inset;will-change:transform}
#frame.hit{border-color:var(--jade);box-shadow:0 0 0 2000px #0006,0 0 30px var(--jade) inset}
#capMsg{position:absolute;z-index:3;left:16px;right:16px;top:52%;text-align:center;font:900 22px var(--display);text-shadow:0 2px 10px #000;letter-spacing:.1em;pointer-events:none}
#capBot{position:absolute;left:0;right:0;bottom:0;height:46%;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(#0000,#000b)}
#hands{position:absolute;bottom:-9%;left:50%;width:min(100%,440px);z-index:0;aspect-ratio:1/1;translate:-50% 0;background:url(art/hands.webp) 0 0/200% 200% no-repeat;pointer-events:none;transition:scale .12s;transform-origin:50% 100%}
#hands.cast{scale:1.12;filter:drop-shadow(0 0 18px var(--gold))}
#cap:not(.demo) #ret{display:none}
#capBtn{position:absolute;z-index:2;left:50%;translate:-50% 0;bottom:20px;width:92px;height:92px;border-radius:50%;background:var(--wood);color:#f6e7c5;font:400 46px/1 var(--cal);text-shadow:0 2px 0 #2a1608;box-shadow:0 0 0 4px #000,0 0 0 6px var(--gold),0 0 30px #000c}
#capBtn small{display:block;font:500 11px var(--body);letter-spacing:.1em}
#capBtn:active{transform:scale(.94)}
#src{position:absolute;inset:0;background:#0c0f1fee;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#src.on{display:flex}
#src p{margin:0;color:var(--muted);max-width:300px;line-height:1.7;font-size:13px}
#src .btn{min-width:210px;padding:12px 16px;display:inline-block}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}

/* 手機：台股 */
#phone{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px}
#phone.on{display:flex}
.ph{width:min(100%,390px);height:min(100%,740px);background:#05070f;border:3px solid #3a4069;border-radius:34px;padding:12px;display:flex;flex-direction:column;box-shadow:0 20px 60px #000}
.ph .scr{flex:1;background:var(--ink);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.ph .top{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ph .top .l1{display:flex;justify-content:space-between;align-items:center}
.ph h2{margin:0;font:900 17px var(--display);letter-spacing:.06em}
.pill{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
.pill.open{color:var(--up);border-color:var(--up)}
.sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:11px;color:var(--muted)}
.sum b{display:block;font-size:14px;color:var(--paper);font-variant-numeric:tabular-nums}
#pbody{flex:1;overflow-y:auto;padding:8px 12px 16px}
.q{display:grid;grid-template-columns:1fr 70px 78px;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid #31386580;width:100%;text-align:left}
.q b{display:block}.q small{color:var(--muted);font-size:11px}
.q .p{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.q .ch{text-align:center;border-radius:6px;padding:4px 0;font-size:12px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--down)}
.ch.up{background:var(--up);color:#fff}.ch.dn{background:var(--down);color:#062}
.pxb{font:900 34px var(--display);font-variant-numeric:tabular-nums}
#qty{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--paper);font:700 18px var(--body);padding:8px 10px;text-align:right}
.sw{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.sw input{width:18px;height:18px;accent-color:var(--gold)}
#snd{width:38px;height:38px;border-radius:50%;background:#161a31e0;border:1px solid var(--line);font-size:17px}
#snd.off{opacity:.45;text-decoration:line-through}
.eqi{display:block;flex:none;background:url(art/equip.webp) 0 0/600% 600% no-repeat;border-radius:10px}
.slot .eqi{margin:2px auto}
.lock{display:flex;align-items:center;gap:10px;font-size:13px}
.lock input{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:15px;background:#0c0f1f;border:1px solid var(--line);position:relative;transition:.2s;flex:none}
.lock input::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:.2s}
.lock input:checked{background:var(--seal)}.lock input:checked::after{left:25px;background:#fff}
.slide{position:relative;height:52px;border-radius:26px;background:#0c0f1f;border:1px solid var(--line);display:grid;place-items:center}
.slide em{font-style:normal;font-size:12px;color:var(--muted);pointer-events:none}
.slide input{position:absolute;inset:0;width:100%;height:100%;margin:0;appearance:none;-webkit-appearance:none;background:none}
.slide input:disabled{opacity:.3}
.slide input::-webkit-slider-thumb{-webkit-appearance:none;width:46px;height:46px;border-radius:50%;background:var(--seal);border:3px solid #fff}
.slide input::-moz-range-thumb{width:42px;height:42px;border-radius:50%;background:var(--seal);border:3px solid #fff}
#cut{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0c0f1f url(art/cut.webp) center/cover;overflow:hidden;text-align:center}
#cut.on{display:flex;animation:fade .3s}
#cut .rays{position:absolute;inset:-50%;background:repeating-conic-gradient(#fff4 0 6deg,#0000 6deg 18deg);animation:spin 16s linear infinite;-webkit-mask:radial-gradient(circle,#000 8%,#0000 60%);mask:radial-gradient(circle,#000 8%,#0000 60%)}
#cut .who{position:relative;animation:pop .6s .15s both;filter:drop-shadow(0 0 26px #ffd76a)}
#cut .ttl{position:relative;display:flex;flex-direction:column;gap:4px;text-shadow:0 2px 12px #000,0 0 4px #000}
#cut .ttl b{font-size:62px;line-height:1.1;color:#fff}
#cut .ttl small{letter-spacing:.3em;color:var(--gold);font-weight:700}
#cut .btn{position:relative;padding:12px 30px}
#comic{position:fixed;inset:0;display:none;place-items:center;background:#000b;overflow:hidden}
#comic.on,#comic.out{display:grid}
#comic .pan{grid-area:1/1;width:130%;height:50%;background:url(art/comic.webp) 0 0/200% 200%;rotate:-5deg;border-block:6px solid #fff;box-shadow:0 0 0 6px #000;animation:cin .22s cubic-bezier(.2,.9,.3,1.1)}
#comic .who{grid-area:1/1;animation:pop .35s .08s both}
#comic.good .who .ico{animation:hop .26s .4s 4 alternate}
#comic.bad .who .ico{animation:shk .07s .35s 16 alternate;filter:saturate(.55)}
#comic .sfx{grid-area:1/1;align-self:start;margin-top:22%;font-size:66px;rotate:-8deg;color:#ffe27a;-webkit-text-stroke:3px #1b1730;paint-order:stroke;text-shadow:4px 5px 0 #000;animation:pop .3s .22s both}
#comic.bad .sfx{color:#bfe0ff}
#comic.out{animation:cout .33s forwards}
@keyframes cin{from{translate:110% 0}}
@keyframes cout{to{translate:-110% 0}}
@keyframes pop{from{scale:0}70%{scale:1.2}}
@keyframes hop{to{translate:0 -34px;rotate:6deg}}
@keyframes shk{from{translate:-7px 0}to{translate:7px 0}}
@keyframes spin{to{rotate:1turn}}
@keyframes fade{from{opacity:0}}
.q2{display:grid;grid-template-columns:1fr 66px 62px 34px 34px;align-items:center;gap:6px;padding:9px 2px;border-bottom:1px solid #31386580}
.q2 .qi{text-align:left;min-width:0}.q2 .qi b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.q2 small{color:var(--muted);font-size:11px}
.q2 .p{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bs{height:34px;border-radius:8px;font-weight:700;color:#fff}.bs.b{background:var(--up)}.bs.s{background:var(--down);color:#063}
.pn{background:var(--panel);border-radius:12px;padding:10px;margin:6px 0 10px;display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11px;color:var(--muted)}.kv b{display:block;color:var(--paper);font-size:13px;font-variant-numeric:tabular-nums}
.addw{display:flex;gap:8px;margin:12px 0}.addw input,.addw select{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--paper);font:inherit;padding:8px 10px}
.ico .pd{position:absolute;aspect-ratio:1;background:url(art/equip.webp) 0 0/600% 600% no-repeat;pointer-events:none;filter:drop-shadow(0 1px 2px #0008)}
.ico .pd.a{left:30%;top:52%;width:40%}.ico .pd.w{left:60%;top:34%;width:50%;rotate:18deg}.ico .pd.c{left:2%;top:54%;width:28%}
#battle{position:fixed;inset:0;display:none;flex-direction:column;background:linear-gradient(#0c0f1f99,#0c0f1fe6),url(art/sky.webp) center/cover;padding:56px 10px 10px;gap:8px}
#battle.on{display:flex}
#battle .foes,#battle .allies{flex:1;display:flex;justify-content:space-around;align-items:center;gap:4px}
#battle .allies{align-items:flex-end}
.unit{display:flex;flex-direction:column;align-items:center;gap:2px;width:31%;font-size:12px;position:relative}
.unit b{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit small{color:var(--muted);font-size:10px}.unit .bar{width:86%;flex:none}
.unit.dead{opacity:.25;filter:grayscale(1)}
.unit.cur .ico{filter:drop-shadow(0 0 10px var(--gold))}
.unit.hit .ico{animation:shk .06s 8 alternate}
.unit em{position:absolute;top:10%;font:900 26px var(--display);color:#fff;-webkit-text-stroke:1px #000;animation:dmg .7s forwards;font-style:normal;pointer-events:none}
.unit em.heal{color:var(--jade)}
@keyframes dmg{from{translate:0 10px;opacity:0}30%{opacity:1}to{translate:0 -34px;opacity:0}}
.bbox{background:#000;border:3px double #fff;border-radius:6px;padding:10px 12px;min-height:168px;display:flex;flex-direction:column;gap:8px;font-size:15px;letter-spacing:.04em}
.bbox p{margin:0;min-height:2.6em;line-height:1.5}
#bcmd{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#bcmd button{text-align:left;padding:9px 8px;border:1px solid #fff5;border-radius:4px;color:#fff}
#bcmd button::before{content:"▶ ";color:var(--gold)}
#bcmd button:disabled{opacity:.35}
#bcmd button small{display:block;color:var(--muted);font-size:11px;padding-left:1.3em}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%) translateY(-20px);background:var(--paper);color:#1b1730;font-weight:700;padding:9px 16px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;max-width:86%;text-align:center;box-shadow:0 6px 20px #0009}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== 玩具風外觀 ===== */

#battle .unit .plate{position:absolute;top:calc(var(--h)*.08);left:0;translate:-50% 0;min-width:92px;margin:0;padding:1px 7px 2px;font-size:11px;white-space:nowrap;background:#1b1209d8}

#bgl{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#battle .stage.s3{background:none}#battle .stage.s3 .unit .fig,#battle .stage.s3 .unit .shd{visibility:hidden}
#battle .stage.s3 .unit.cur .nm{color:#ffd76a}#battle .field:has(.s3)::before{background:linear-gradient(#7cc4ff,#e7f4ff);filter:none}
#battle .unit .nm i{font-style:normal;font-size:10px;color:#9fd0ff;margin-left:4px}

#battle .unit .qi{height:5px;border-radius:3px;overflow:hidden;background:#0008;box-shadow:0 0 0 1px #000a}

 try{const j=await (await fetch(QUOTE_API+'/k?id='+k)).json();if(j.c&&j.c.length>1){HIST[k]=j.c.filter(x=>x!=null);if(exp===k)upd()}}catch(e){}}
function pv(){let v=0,c=0;for(const k in S.port){v+=S.port[k].q*S.px[k];c+=S.port[k].cost}return [v,v-c]}
function head(){const o=open(),m=$('#mkt');m.textContent=o?'盤中':'休市';m.classList.toggle('open',o);
 const sp2=$('#srcp');sp2.textContent=liveOK?'即時行情':'模擬報價';sp2.classList.toggle('open',liveOK);
 const [v,pl]=pv();$('#pz').textContent=fmt(S.zeny);$('#pv').textContent=fmt(v);const e=$('#pl');e.textContent=(pl>=0?'+':'')+fmt(pl);e.className=pl>=0?'up':'dn'}
const chg=k=>REF[k]?(S.px[k]-REF[k])/REF[k]*100:0;
const ptxt=k=>{const c=chg(k);return [S.px[k].toFixed(2),(c>=0?'+':'')+c.toFixed(2)+'%',c>=0?'up':'dn']};
function drawPhone(){head();const b=$('#pbody');
 let h=liveOK?'':`<p class="note">目前是模擬報價，不是真實行情。接上報價代理後會自動換成台股即時價。</p>`;
 if(!canTrade())h+='<p class="note">現在休市（週一至週五 09:00–13:30）。勾「練習盤」可先試單。</p>';
 h+=S.watch.map(k=>{const [p,c,cl]=ptxt(k),hd=S.port[k];
  let r=`<div class="q2"><button class="qi" data-a="stk" data-v="${k}"><b>${esc(sname(k))}</b><small>${k}${hd?` · 持有 ${fmt(hd.q)} 股`:''} ${exp===k?'▴':'▾'}</small></button><span class="p ${cl}" id="p_${k}">${p}</span><span class="ch ${cl}" id="c_${k}">${c}</span><button class="bs b" data-a="ord" data-v="${k}|1" aria-label="買進${k}">買</button><button class="bs s" data-a="ord" data-v="${k}|-1" aria-label="賣出${k}">賣</button></div>`;
  if(exp===k){const L=LIVE[k]||{};r+=`<div class="pn"><svg id="sp" viewBox="0 0 300 90" style="width:100%;height:90px"></svg>
   <div class="kv"><span>開盤<b>${L.o||'—'}</b></span><span>最高<b>${L.h||'—'}</b></span><span>最低<b>${L.l||'—'}</b></span><span>昨收<b>${REF[k]?(+REF[k]).toFixed(2):'—'}</b></span></div>
   <div class="kv"><span>持有<b>${hd?fmt(hd.q):0} 股</b></span><span>均價<b>${hd?(hd.cost/hd.q).toFixed(2):'—'}</b></span><span>損益<b id="dpl">—</b></span><span>${hd||k==='2330'?'':`<button class="pill" data-a="unwatch" data-v="${k}">移出自選</button>`}</span></div>
   ${ordMode?`<label for="qty" class="note">${ordMode>0?'買進':'賣出'}股數（1 股為單位）</label><input id="qty" type="number" inputmode="numeric" min="1" value="${ordMode<0&&hd?hd.q:100}">
   <div class="grid5" style="grid-template-columns:repeat(4,1fr)">${[1,10,100,1000].map(n=>`<button class="btn g2" style="padding:7px 0" data-a="q" data-v="${n}">+${n}</button>`).join('')}</div>
   <p class="note" id="est"></p><button class="btn" data-a="go" style="background:var(${ordMode>0?'--up':'--down'});${ordMode>0?'':'color:#063'}">確認${ordMode>0?'買進':'賣出'}</button>`:''}</div>`}
  return r}).join('');
 h+=`<div class="addw">${liveOK?'<input id="addCode" inputmode="numeric" placeholder="輸入股票代號，例如 2603" aria-label="股票代號">':`<select id="addCode" aria-label="加入自選">${STK.filter(s=>!S.watch.includes(s[0])).map(s=>`<option value="${s[0]}">${s[0]} ${s[1]}</option>`).join('')}</select>`}<button class="btn g2" data-a="addW">加入自選</button></div>
 <p class="note">1 zeny = 1 台幣。手續費 0.1425%，賣出另收證交稅 0.3%。紅漲綠跌。點股票名稱可展開或收起當日走勢。</p>`;
 b.innerHTML=h;const q=$('#qty');if(q)q.oninput=est;upd()}
function upd(){head();S.watch.forEach(k=>{const [p,c,cl]=ptxt(k),a=$('#p_'+k),b=$('#c_'+k);if(a){a.textContent=p;a.className='p '+cl;b.textContent=c;b.className='ch '+cl}});
 const s=$('#sp');if(!exp||!s)return;const k=exp,p=S.px[k],ref=REF[k]||p,c=chg(k),hh=(HIST[k]&&HIST[k].length>1)?HIST[k]:[ref,p],mn=Math.min(...hh,ref),mx=Math.max(...hh,ref),rg=mx-mn||1,
  pt=hh.map((v,i)=>`${(i/(hh.length-1)*296+2).toFixed(1)},${(82-(v-mn)/rg*72).toFixed(1)}`),col=c>=0?'#ff5a4d':'#3ecf8e',ry=82-(ref-mn)/rg*72,l=pt[pt.length-1].split(',');
 s.innerHTML=`<line x1="0" x2="300" y1="${ry}" y2="${ry}" stroke="#9ea4c8" stroke-dasharray="3 4" stroke-width="1" opacity=".5"/><polygon points="2,90 ${pt.join(' ')} ${l[0]},90" fill="${col}" opacity=".14"/><polyline points="${pt.join(' ')}" fill="none" stroke="${col}" stroke-width="2"/><circle cx="${l[0]}" cy="${l[1]}" r="3.5" fill="${col}"/>`;
 const hd=S.port[k],e=$('#dpl');if(hd&&e){const pl=hd.q*p-hd.cost;e.textContent=(pl>=0?'+':'')+fmt(pl);e.className=pl>=0?'up':'dn'}est()}
function est(){const q0=$('#qty'),e=$('#est');if(!q0||!e)return;const q=Math.max(0,Math.floor(+q0.value||0)),a=q*S.px[exp],fee=Math.max(1,Math.ceil(a*.001425));
 e.textContent=ordMode>0?`約需 ${fmt(Math.ceil(a)+fee)} zeny（含手續費 ${fmt(fee)}）`:`約可得 ${fmt(Math.floor(a)-fee-Math.ceil(a*.003))} zeny（已扣手續費與證交稅）`}
function trade(dir){if(!canTrade())return toast('休市中，勾「練習盤」可試單');const k=exp,q=Math.floor(+$('#qty').value||0);if(q<1)return toast('請輸入股數');
 const p=S.px[k],a=q*p,fee=Math.max(1,Math.ceil(a*.001425));let h=S.port[k];
 if(dir>0){const cost=Math.ceil(a)+fee;if(S.zeny<cost)return toast('zeny 不夠');S.zeny-=cost;h=S.port[k]=h||{q:0,cost:0};h.q+=q;h.cost+=cost;toast(`買進 ${sname(k)} ${fmt(q)} 股，花費 ${fmt(cost)}`)}
 else{if(!h||h.q<q)return toast('持股不足');const get=Math.floor(a)-fee-Math.ceil(a*.003),part=h.cost*q/h.q;S.zeny+=get;h.q-=q;h.cost-=part;if(!h.q)delete S.port[k];toast(`賣出 ${sname(k)} ${fmt(q)} 股，${get-part>=0?'賺':'賠'} ${fmt(Math.abs(get-part))}`)}
 ordMode=0;hud();drawPhone()}
$('#prac').onchange=e=>{S.prac=e.target.checked;save();drawPhone()};

/* ====== 啟動 ====== */
load();S.watch.forEach(k=>{REF[k]=S.px[k];HIST[k]=[S.px[k]]});
hud();$('#snd').classList.toggle('off',!!S.mute);
try{if(USE3D){build3D=buildHome3D;initHome3D()}else init3D()}catch(e){console.error(e)}
if(!R)$('#cnt').textContent=`已收服 ${S.cr.length} 位夥伴`;
if('serviceWorker' in navigator&&/github\.io$|localhost/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{});
setInterval(tick,3000);
setInterval(()=>{S.cr.forEach(c=>{c.sta=Math.min(100,c.sta+1);c.mood=Math.max(0,c.mood-.2)});save()},15000);
</script>
</body>
</html>
